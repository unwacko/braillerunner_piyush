<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Braille Bridge</title>
<style>
  :root { --bg:#fafaf7; --fg:#1c1c1a; --muted:#6b6b66; --card:#fff; --line:#e4e2dc; --accent:#2f5d50; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --fg:#ecebe6; --muted:#9a9993; --card:#1f1f1d; --line:#33322f; --accent:#7fb8a4; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, -apple-system, "Noto Sans", sans-serif; }
  main { max-width: 880px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .buttons { display:flex; gap:12px; flex-wrap:wrap; }
  button { font: inherit; font-size: 18px; padding: 16px 24px; border-radius: 12px; border: 2px solid var(--accent); background: var(--accent); color: var(--bg); cursor: pointer; }
  button.secondary { background: transparent; color: var(--accent); }
  button:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  .hint { color: var(--muted); font-size: 14px; margin-top: 10px; }
  #cam { display:none; margin-top:16px; }
  #cam video { width: 100%; max-width: 560px; border-radius: 12px; background:#000; display:block; margin-bottom: 10px; }
  #status { margin: 20px 0 0; font-weight: 600; min-height: 1.5em; }
  #preview { margin-top: 16px; max-width: 100%; border: 1px solid var(--line); border-radius: 12px; display:none; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-top: 14px; }
  .card h3 { margin: 0 0 6px; font-size: 15px; color: var(--muted); font-weight: 600; display:flex; justify-content: space-between; gap: 8px; }
  .txt { font-size: 22px; word-wrap: break-word; }
  .br { font-size: 26px; letter-spacing: 2px; word-wrap: break-word; line-height: 1.4; margin-top: 6px; }
  .src { border-color: var(--accent); border-width: 2px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 0 14px; }
  .err { color: #b3261e; }
</style>
</head>
<body>
<main>
  <h1>Braille Bridge</h1>
  <p class="sub">Read braille writing (English or Bharati braille) and show it in Indian languages, in text and in braille.</p>
  <div class="buttons">
    <button id="btnCam">📷 Take picture with webcam</button>
    <button id="btnUpload" class="secondary">⬆️ Upload image</button>
    <input id="file" type="file" accept="image/*" hidden>
  </div>
  <p class="hint">You can also paste an image (or braille text like ⠓⠑⠇⠇⠕) anywhere on this page with Ctrl/⌘+V.</p>
  <div id="cam">
    <video id="video" autoplay playsinline muted></video>
    <button id="btnSnap">Capture</button>
    <button id="btnCamClose" class="secondary">Cancel</button>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
  <canvas id="preview"></canvas>
  <div id="out"></div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
